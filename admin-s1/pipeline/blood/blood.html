<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:M;src:url('file:///home/user/.fonts/Montserrat.ttf');font-weight:100 900}
html,body{margin:0;width:1080px;height:1920px;background:#000;overflow:hidden}
#wrap{position:absolute;inset:0;transform-origin:540px 900px}
#glow{position:absolute;left:0;top:0;width:1080px;height:1920px;background:radial-gradient(ellipse 620px 360px at 540px 905px,rgba(120,0,0,.33),rgba(0,0,0,0) 70%)}
svg{position:absolute;left:0;top:0}
</style></head><body><div id="wrap"><div id="glow"></div>
<svg id="s" width="1080" height="1920" viewBox="0 0 1080 1920">
<defs>
<linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b80000"/><stop offset=".55" stop-color="#7d0000"/><stop offset="1" stop-color="#480000"/></linearGradient>
<filter id="blood" x="-5%" y="-5%" width="110%" height="140%" color-interpolation-filters="sRGB">
<feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="11" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="6" xChannelSelector="R" yChannelSelector="G" result="r"/>
<feGaussianBlur in="r" stdDeviation="2.2" result="b"/>
<feSpecularLighting in="b" surfaceScale="4" specularConstant="1.1" specularExponent="28" lighting-color="#ff8a8a" result="sp"><fePointLight x="420" y="520" z="260"/></feSpecularLighting>
<feComposite in="sp" in2="r" operator="in" result="spi"/>
<feComposite in="r" in2="spi" operator="arithmetic" k1="0" k2="1" k3="0.55" k4="0"/>
</filter></defs>
<g id="blood" filter="url(#blood)" fill="url(#g)">
<text id="t1" x="540" y="860" text-anchor="middle" font-family="M" font-weight="900" font-size="74" letter-spacing="1">ДОБРО ПОЖАЛОВАТЬ</text>
<text id="t2" x="540" y="1060" text-anchor="middle" font-family="M" font-weight="900" font-size="196" letter-spacing="3">В ИГРУ</text>
<g id="drips"></g>
</g></svg></div>
<script>
const NS='http://www.w3.org/2000/svg';
function rnd(s){return function(){s=(s*16807)%2147483647;return (s-1)/2147483646;}}
const R=rnd(20261009); const drips=[];
function addDrips(id,count,maxL,baseY){
  const t=document.getElementById(id); const txt=t.textContent; const n=txt.length;
  const idx=[]; for(let i=0;i<n;i++){ if(txt[i]!==' ') idx.push(i);}
  for(let k=0;k<count;k++){
    const i=idx[Math.floor(R()*idx.length)]; const e=t.getExtentOfChar(i); const ch=txt[i];
    let f=0.2; if(ch==='Т') f=0.5; if(ch==='У') f=0.32; if(ch==='Ж') f=0.12; if(ch==='Г') f=0.22;
    const x=e.x+e.width*(f+ (R()-0.5)*0.08); const w=8+R()*12; const L=maxL*(0.25+0.75*R());
    const delay=0.15+R()*0.9; const dur=1.3+R()*1.4;
    const g=document.createElementNS(NS,'g'); const r=document.createElementNS(NS,'rect'); const c=document.createElementNS(NS,'circle');
    r.setAttribute('x',x-w/2); r.setAttribute('y',baseY-6); r.setAttribute('width',w); r.setAttribute('rx',w/2); r.setAttribute('height',0);
    c.setAttribute('cx',x); c.setAttribute('cy',baseY); c.setAttribute('r',w*0.75);
    g.appendChild(r); g.appendChild(c); document.getElementById('drips').appendChild(g);
    drips.push({r,c,baseY,L,delay,dur,w});
  }
}
addDrips("t1",8,170,862); addDrips("t2",10,400,1062);
window.render=function(t){
  for(const d of drips){ let p=(t-d.delay)/d.dur; p=Math.max(0,Math.min(1,p)); const e=1-Math.pow(1-p,2.2); const len=d.L*e;
    d.r.setAttribute('height',Math.max(0,len)); d.c.setAttribute('cy',d.baseY+len); d.c.setAttribute('r',p>0?d.w*(0.62+0.25*p):0); }
  const wrap=document.getElementById('wrap'); const z=1+0.035*Math.min(1,t/3.4);
  let op=1, jx=0; if(t<0.32){ const f=Math.floor(t*24); op=[0,1,0,1,1,0,1,1][f%8]; jx=[0,-14,0,9,-5,0,4,0][f%8]; }
  wrap.style.opacity=op; wrap.style.transform='translateX('+jx+'px) scale('+z+')';
};
window.render(0);
</script></body></html>
